name: Release

# Push a tag like v1.0.0 (matching versionName in plugin/app/build.gradle.kts
# and version in server/main.go) to publish a GitHub Release with the signed
# plugin APK and the server for each platform, and the server image on GHCR.
# The NextColor Apps F-Droid repo picks up the APK from here on its own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # Both are needed to attest the APK and the server builds
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches both versions
        run: |
          plugin=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' plugin/app/build.gradle.kts)
          server=$(sed -n 's/^const version = "\(.*\)"/\1/p' server/main.go)
          if [ "v$plugin" != "$GITHUB_REF_NAME" ] || [ "v$server" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $plugin in plugin/app/build.gradle.kts and version $server in server/main.go"
            exit 1
          fi

  plugin:
    needs: check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Unpack signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build signed APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.p12
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Kotodex-$GITHUB_REF_NAME.apk"

      # Records that this exact APK was built by this workflow from this commit.
      # Anyone can check a download with: gh attestation verify <file> --repo <owner>/Kotodex
      - name: Attest APK
        uses: actions/attest@v4
        with:
          subject-path: dist/Kotodex-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: dist/

  server:
    needs: check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test
        run: go test ./...

      - name: Build for each platform
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "../dist/kotodex-$GITHUB_REF_NAME-$os-$arch$ext" .
          done

      - name: Attest server builds
        uses: actions/attest@v4
        with:
          subject-path: dist/kotodex-*

      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: dist/

  image:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kotodex
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/kotodex
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: [plugin, server, image]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        run: |
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' plugin/app/build.gradle.kts)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Kotodex $GITHUB_REF_NAME" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$code.txt"
