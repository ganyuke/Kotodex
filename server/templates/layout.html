<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} - Kotodex</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
</head>
<body>
{{if .User}}
<header class="top">
  <div class="bar">
    <a class="brand" href="/">Kotodex</a>
    <nav>
      <a href="/"{{if eq .Nav "library"}} class="on"{{end}}>Library</a>
      <a href="/downloads"{{if eq .Nav "downloads"}} class="on"{{end}}>Downloads</a>
      <a href="/settings"{{if eq .Nav "settings"}} class="on"{{end}}>Settings</a>
    </nav>
    <form class="search" action="/search" method="get" role="search">
      <input type="search" name="q" value="{{.Search}}" placeholder="Search MangaDex or paste a link" aria-label="Search MangaDex">
    </form>
    <form action="/logout" method="post" class="signout">
      <span class="who">{{.User.Name}}</span>
      <button class="link" type="submit">Sign out</button>
    </form>
  </div>
</header>
{{end}}
<main{{if not .User}} class="narrow"{{end}}>
{{if .Notice}}<p class="notice">{{.Notice}}</p>{{end}}
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
{{template "content" .}}
</main>
<script src="/static/app.js"></script>
</body>
</html>
